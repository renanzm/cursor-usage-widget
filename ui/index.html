<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="w" class="widget" data-level="low" data-state="loading">
    <!-- Aba recolhida -->
    <section class="tab">
      <span class="dot"></span>
      <span id="tab-amount" class="tab-amount">--</span>
      <span id="tab-label" class="tab-label">ciclo</span>
      <span class="tab-bar"><i id="tab-fill"></i></span>
    </section>

    <!-- Painel expandido -->
    <section class="panel">
      <header class="row r1">
        <span class="eyebrow">Ritmo · <span id="window-label">3h</span></span>
        <span class="head-right">
          <span id="clock" class="clock"></span>
          <button id="open-settings" class="gear" type="button" title="Configurações" aria-label="Configurações">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </span>
      </header>

      <div class="gauge-wrap row r2">
        <svg viewBox="0 0 200 124" class="gauge" aria-hidden="true">
          <defs>
            <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="178" y2="0">
              <stop offset="0" style="stop-color: var(--lvl-low)" />
              <stop offset="0.5" style="stop-color: var(--lvl-mid)" />
              <stop offset="0.78" style="stop-color: var(--orange)" />
              <stop offset="1" style="stop-color: var(--lvl-high)" />
            </linearGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3.2" />
            </filter>
          </defs>
          <path id="track" class="track" pathLength="100" d="M22 100 A78 78 0 0 1 178 100" />
          <path id="fill-glow" class="fill glow" pathLength="100" d="M22 100 A78 78 0 0 1 178 100" filter="url(#glow)" />
          <path id="fill" class="fill" pathLength="100" d="M22 100 A78 78 0 0 1 178 100" />
          <g id="ticks" class="ticks"></g>
          <g id="needle" class="needle">
            <line x1="100" y1="100" x2="100" y2="46" />
            <circle cx="100" cy="100" r="6" class="hub" />
            <circle cx="100" cy="100" r="2.2" class="hub-core" />
          </g>
          <text x="22" y="118" class="scale-label" text-anchor="middle">0</text>
          <text id="scale-max" x="178" y="118" class="scale-label" text-anchor="middle"></text>
        </svg>
      </div>

      <div class="rate-block row r3">
        <div class="rate"><strong id="rate">--</strong><small>/h</small></div>
        <div class="rate-sub">
          <span id="level-chip" class="chip">--</span>
          <span class="muted">últimas <span id="window-hours">3h</span></span> <b id="window">--</b>
        </div>
      </div>

      <div class="divider row r4"></div>

      <div class="limits row r4">
        <div class="lim">
          <div class="lim-head"><span class="eyebrow">Sessão · 5h</span><span id="lim5-pct" class="pct">--</span></div>
          <div class="bar"><i id="lim5-fill"></i></div>
          <div id="lim5-reset" class="lim-sub"></div>
        </div>
        <div class="lim">
          <div class="lim-head"><span class="eyebrow">Semana</span><span id="lim7-pct" class="pct">--</span></div>
          <div class="bar"><i id="lim7-fill"></i></div>
          <div id="lim7-reset" class="lim-sub"></div>
        </div>
        <div id="lim-note" class="lim-sub" hidden></div>
      </div>

      <div class="divider row r4"></div>

      <div class="cycle row r5">
        <div class="cycle-head">
          <span class="eyebrow">Ciclo mensal</span>
          <span id="cycle-pct" class="pct">--</span>
        </div>
        <div class="cycle-amount"><b id="cycle-used">--</b><span id="cycle-limit" class="muted"></span></div>
        <div class="bar"><i id="cycle-fill"></i></div>
        <div id="projection" class="projection"></div>
      </div>

      <div class="week row r6">
        <div class="week-head">
          <span class="eyebrow">Semana · seg–sex</span>
          <span id="week-total" class="muted small"></span>
        </div>
        <div id="eq" class="eq"></div>
      </div>

      <div class="hint">
        <strong>Conectar ao Cursor</strong>
        <p>Cole o cookie <code>WorkosCursorSessionToken</code><br />
        <span>cursor.com › F12 › Application › Cookies</span></p>
      </div>
      <div id="msg" class="msg" hidden></div>
      <form id="cookie-form" class="cookie" hidden>
        <input id="cookie-input" type="password" placeholder="Cole o cookie aqui" autocomplete="off" spellcheck="false" />
        <button type="submit">Salvar</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
